<!-- Insert scripts NOT needed by stylesheets here -->
<script>
  (() => {
    const cookie = document.cookie
      .split("; ")
      .find((entry) => entry.startsWith("font-preference="));

    if (!cookie) return;

    const savedPreference = cookie.slice("font-preference=".length);
    const preference = savedPreference === "avenir" ? "system" : savedPreference;
    if (preference === "system" || preference === "jost") {
      document.documentElement.setAttribute("data-font-preference", preference);
    }
  })();
</script>
