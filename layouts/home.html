{{ define "main" }}
<section class="section homepage mt-n3 pb-3">
  <header class="homepage-header">
    <h1>{{ .Title }}</h1>
    {{ with partial "main/page-description.html" . }}
      {{ . }}
    {{ else }}
      {{ with .Params.lead }}<p class="lead">{{ . | safeHTML }}</p>{{ end }}
    {{ end }}
  </header>
  {{ .Content }}
</section>
{{ end }}

{{ define "sidebar-prefooter" }}
  {{ if site.Params.doks.backgroundDots -}}
  <div class="d-flex justify-content-start">
    <div class="bg-dots"></div>
  </div>
  {{ end -}}
{{ end }}
