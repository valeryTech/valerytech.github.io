<div class="site-footer site-frame hextra-max-footer-width hx:mx-auto">
  <div class="site-footer-intro">
    <a class="site-footer-title" href="{{ site.Home.RelPermalink }}">{{ site.Title }}</a>
    <p>Working notes by <a href="{{ "about/" | relURL }}">Valery Yuda</a>.</p>
  </div>
  <nav aria-label="Footer">
    {{ range site.Menus.footer }}
      <section class="site-footer-group" aria-labelledby="footer-{{ .Identifier }}">
        <h2 id="footer-{{ .Identifier }}">{{ .Name }}</h2>
        <ul>
          {{ range .Children }}<li><a href="{{ .URL }}" {{ if eq .URL ("settings/" | relURL) }}data-site-settings-open{{ end }}>{{ .Name }}</a></li>{{ end }}
        </ul>
      </section>
    {{ end }}
  </nav>
  <div class="site-footer-preferences">
    {{ if .switchesVisible }}
      {{ if hugo.IsMultilingual }}{{ partial "language-switch.html" (dict "context" .context) }}{{ end }}
    {{ end }}
    <div id="font-preference-container"></div>
  </div>
</div>
