<div class="modal" id="searchModal" tabindex="-1" aria-labelledby="searchModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-dialog-scrollable">
    <div class="modal-content">
      <div class="modal-header">
        <h2 class="modal-title fs-5 visually-hidden" id="searchModalLabel">{{ i18n "search_placeholder" }}</h2>
        <div class="search-input flex-grow-1 d-none">
          <form id="search-form" class="search-form" action="#" method="post" accept-charset="UTF-8" role="search">
            <label for="query" class="visually-hidden">{{ i18n "search_title" }}</label>
            <div class="d-flex">
              <input type="search" id="query" name="query" class="search-text form-control ph-no-capture" data-ph-no-autocapture placeholder="{{ i18n "search_placeholder" }}" aria-label="{{ i18n "search_placeholder" }}" aria-controls="searchResults" maxlength="128" autocomplete="off">
            </div>
          </form>
        </div>
        <button type="button" class="btn-close ms-3" data-bs-dismiss="modal" aria-label="Close search"></button>
      </div>
      <div class="modal-body">
        <p class="search-loading status message d-none mt-3 text-center">{{ i18n "search_loading" }}</p>
        <p class="search-no-recent message d-none mt-3 text-center">Search articles and notes.</p>
        <p class="search-no-results message d-none mt-3 text-center">{{ i18n "search_no_results" }} for "<strong><span class="query-no-results"></span></strong>"</p>
        <div id="searchResults" class="search-results" aria-live="polite" aria-label="Search results"></div>
        <template>
          <article class="search-result">
            <div class="card">
              <div class="card-body">
                <header>
                  <h2 class="title mb-0"><a class="stretched-link text-decoration-none text-reset"></a></h2>
                  <div class="submitted{{ if eq site.Params.doks.showDate false }} d-none{{ end }}"><time class="created-date"></time></div>
                </header>
                <p class="content{{ if eq site.Params.doks.showSummary false }} d-none{{ end }}"></p>
              </div>
            </div>
          </article>
        </template>
      </div>
      <div class="modal-footer">
        <ul class="list-inline me-auto mb-0 d-none d-md-block">
          <li class="list-inline-item"><kbd>↵</kbd> select</li>
          <li class="list-inline-item"><kbd>↓</kbd> <kbd>↑</kbd> navigate</li>
          <li class="list-inline-item"><kbd>esc</kbd> close</li>
        </ul>
        <p class="d-md-none mb-0">Search by <a class="text-decoration-none" href="https://github.com/nextapps-de/flexsearch">FlexSearch</a></p>
      </div>
    </div>
  </div>
</div>
