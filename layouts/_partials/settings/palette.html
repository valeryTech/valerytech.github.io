{{- $palette := hugo.Data.ui.palette -}}
<template id="site-palette-template">
  <section id="site-palette" class="site-palette not-prose" popover="manual" role="dialog" aria-labelledby="site-palette-title" aria-describedby="site-palette-description">
    <header class="site-palette-header" data-palette-drag>
      <div class="site-palette-heading">
        <h2 id="site-palette-title">{{ $palette.title }}</h2>
        <p id="site-palette-description">{{ $palette.description }}</p>
      </div>
      {{- /* Switches the site theme, so the editor shows and edits that profile. */}}
      <div class="site-settings-segmented site-palette-themes" role="radiogroup" aria-label="{{ $palette.themeLabel }}" data-palette-theme>
        {{- range slice (dict "value" "light" "label" ((T "light") | default "Light") "icon" "sun") (dict "value" "dark" "label" ((T "dark") | default "Dark") "icon" "moon") -}}
          <label class="site-settings-segment">
            <input type="radio" name="site-palette-theme" value="{{ .value }}" />
            <span class="site-settings-segment-label">{{ partial "components/line-icon.html" (dict "name" .icon "class" "site-settings-segment-icon") }}<span>{{ .label }}</span></span>
          </label>
        {{- end -}}
      </div>
      <button type="button" class="site-settings-close" data-palette-close aria-label="Close {{ lower $palette.title }}" title="Close">
        {{ partial "utils/icon.html" (dict "name" "x" "attributes" "height=20") }}
      </button>
    </header>
    <div class="site-palette-body">
      <fieldset class="site-palette-group site-palette-presets">
        <legend>{{ $palette.presetLabel }}</legend>
        {{- /* Every preset shows at once as a chip; the checked chip matches the colors in use. */}}
        <div class="site-palette-chips" role="radiogroup" aria-label="{{ $palette.sitePresetsLabel }}" data-palette-preset>
          {{- range $palette.presets -}}
            {{ partial "settings/palette-chip.html" (dict "value" (printf "site:%s" .id) "label" .label) }}
          {{- end -}}
          <label class="site-palette-chip" data-palette-custom hidden>
            <input type="radio" name="site-palette-preset" value="" disabled />
            <span class="site-palette-chip-label">{{ partial "components/line-icon.html" (dict "name" "check" "class" "site-palette-chip-check") }}<span>{{ $palette.customLabel }}</span></span>
          </label>
        </div>
        <p class="site-palette-chips-heading" id="site-palette-saved-label" data-palette-saved-label hidden>{{ $palette.savedPresetsLabel }}</p>
        <div class="site-palette-chips" role="radiogroup" aria-labelledby="site-palette-saved-label" data-palette-saved hidden></div>
        <template data-palette-chip-template>{{ partial "settings/palette-chip.html" (dict "value" "" "label" "") }}</template>
        <div class="site-palette-save">
          <input type="text" class="site-palette-name" data-palette-name maxlength="40" aria-label="{{ $palette.presetNameLabel }}" placeholder="{{ $palette.presetNameLabel }}" />
          <button type="button" class="site-palette-button site-palette-button-tonal" data-palette-save>{{ $palette.saveLabel }}</button>
          <button type="button" class="site-palette-button" data-palette-delete hidden>{{ $palette.deleteLabel }}</button>
        </div>
      </fieldset>
      {{ range $palette.groups }}
        <fieldset class="site-palette-group">
          <legend>{{ .title }}</legend>
          {{ range .tokens }}
            {{ $id := printf "site-palette-%s" .token }}
            <div class="site-palette-row" data-palette-token="{{ .token }}"{{ with .contrast }} data-palette-against="{{ .against }}" data-palette-minimum="{{ .minimum }}"{{ end }}>
              <input id="{{ $id }}" type="color" class="site-palette-swatch"{{ with .contrast }} aria-describedby="{{ $id }}-contrast"{{ end }} />
              <label for="{{ $id }}">{{ .label }}</label>
              {{ with .contrast }}<span id="{{ $id }}-contrast" class="site-palette-contrast" data-palette-contrast></span>{{ end }}
              <output for="{{ $id }}" class="site-palette-value"></output>
              <button type="button" class="site-palette-revert" data-palette-revert aria-label="Restore default {{ lower .label }}" title="Restore default" hidden>
                {{ partial "utils/icon.html" (dict "name" "reply" "attributes" "height=16") }}
              </button>
            </div>
          {{ end }}
        </fieldset>
      {{ end }}
    </div>
    <footer class="site-palette-footer">
      <button type="button" class="site-palette-button" data-palette-copy>{{ $palette.copyLabel }}</button>
      <button type="button" class="site-palette-button" data-palette-reset>{{ $palette.resetLabel }}</button>
      <p class="site-palette-status" role="status"></p>
    </footer>
  </section>
</template>
