[defaults]
include = ["**/*.md", "*.md"]
exclude = [
  "**/.obsidian/**",
  "**/.DS_Store",
  "**/templates/**",
]
synthesize_section_indexes = true
attachment_mode = "referenced-only"

[defaults.frontmatter]
draft = false
toc = true

[[imports]]
name = "system-design"
source_root_kind = "external"
source_subtree = "system-design"
target_subtree = "system-design"
include = ["**/*.md", "*.md"]

[[imports]]
name = "engineering"
source_root_kind = "external"
source_subtree = "topics/engineering"
target_subtree = "engineering"
include = ["**/*.md", "*.md"]

[[imports]]
name = "ai"
source_root_kind = "external"
source_subtree = "ai"
target_subtree = "ai"
section_title = "AI"
root_index_source = "_index.md"
selection_mode = "opt-out"
exclude = [
  "design-research/reassembly-map.md",
  # Active research coordination files are not publication sources.
  "design/ai-system-design/research-followups-2026-10-30/**",
  # Inboxes are not publication sources (design-research/input stays published).
  "/input/**",
  "product/product-framework/input/**",
  "product/product-model/in/**",
  "product/product-model/in-discovery/**",
  "capabilities/input/**",
  # Captured third-party articles and book material.
  "product/product-model/What Is Product Management Guide.md",
  "product/product-model/input-field-guide.md",
  "product/product-framework/scenarios.md",
]

[[imports]]
name = "ai-engineering"
source_root_kind = "external"
source_subtree = "ai-engineering"
target_subtree = "ai-engineering"
root_index_source = "_index.md"
selection_mode = "opt-out"
exclude = [
  # Inboxes and evaluation case drafts are not publication sources.
  "**/input/**",
  "evaluation/cases/**",
  # An earlier copy of agents/react/analysis.md.
  "agents/react/react_report.md",
]

[imports.sidebar_weights]
"working-assumptions" = 1
"evaluation" = 10
"context" = 20

[[imports]]
name = "projects"
source_root_kind = "external"
source_subtree = "projects"
target_subtree = "projects"
selection_mode = "opt-in"
selection_paths = ["ai-dev-foundation", "code-assistant.md"]
include = ["**/*.md", "*.md"]
root_index_source = "_index.md"

[[imports]]
name = "migration-smoke"
source_root_kind = "repo"
source_subtree = "tests/migrate/smoke_notes/system-design/integrated-test-pages"
target_subtree = "system-design/integrated-test-pages"
include = ["migration-smoke.md"]
synthesize_section_indexes = false
